<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Display</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="shortcut icon" href="/static/assets/favicon.ico">
    <style>
        /* Force the QR library's generated elements to be responsive */
        #qrcode img, #qrcode canvas {
            width: 100% !important;
            height: auto !important;
            aspect-ratio: 1 / 1;
        }

        /* Subtle pulse animation for the QR border */
        .qr-glow {
            box-shadow: 0 0 20px rgba(5, 150, 105, 0.1);
            animation: pulse-border 3s infinite;
        }

        @keyframes pulse-border {
            0% { border-color: rgba(209, 213, 219, 0.5); }
            50% { border-color: rgba(245, 158, 11, 0.5); }
            100% { border-color: rgba(209, 213, 219, 0.5); }
        }
    </style>
</head>

<body class="bg-emerald-950 flex flex-col items-center justify-center min-h-screen p-4 md:p-8">
    
    <div class="bg-white w-full max-w-[450px] max-h-[90vh] md:h-auto rounded-[2.5rem] p-8 md:p-10 shadow-2xl flex flex-col items-center text-center border-b-8 border-amber-500 overflow-hidden">
        
        <div class="mb-6 w-full">
            <h1 class="text-2xl md:text-3xl font-black text-emerald-950 mb-2 tracking-tight">Staff Check-In</h1>
            <p class="text-emerald-600/70 text-sm font-medium">Position your code within the frame</p>
        </div>

        <div class="w-full flex-grow flex items-center justify-center mb-8">
            <div id="qrcode" class="w-full max-w-[280px] p-4 bg-white border-2 border-emerald-50 rounded-3xl qr-glow transition-all">
                </div>
        </div>

        <div class="w-full mt-auto space-y-6">
            <div class="w-full bg-emerald-100 h-2 rounded-full overflow-hidden">
                <div id="progress-bar" class="bg-emerald-600 h-full transition-all duration-1000 ease-linear"
                    style="width: 100%"></div>
            </div>
            
            <div class="flex flex-col items-center gap-3">
                <div class="px-4 py-1.5 bg-emerald-50 rounded-lg border border-emerald-100">
                    <span class="text-emerald-700 font-mono text-lg font-bold tabular-nums">
                        00:<span id="timer">30</span>
                    </span>
                </div>
                <p class="text-[10px] font-bold text-emerald-900/30 uppercase tracking-[0.2em]">
                    Refreshing Secure Key
                </p>
            </div>
        </div>

    </div>

    <script src="/static/js/display.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Attendance Display</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="shortcut icon" href="/static/assets/favicon.ico">
</head>

<body class="bg-emerald-900 flex flex-col items-center justify-center h-screen">
    <div class="bg-white p-12 rounded-3xl shadow-2xl text-center border-t-8 border-amber-500">
        <h1 class="text-3xl font-bold text-emerald-950 mb-2">Scan to Clock In/Out</h1>
        <p class="text-emerald-600/60 mb-8">QR code refreshes automatically</p>

        <div id="qrcode" class="flex justify-center mb-8 p-4 bg-white border-4 border-emerald-50 rounded-xl"></div>

        <div class="w-full bg-emerald-100 h-2 rounded-full overflow-hidden mb-2">
            <div id="progress-bar" class="bg-emerald-600 h-full transition-all duration-1000 ease-linear"
                style="width: 100%"></div>
        </div>
        <div
            class="flex items-center justify-center space-x-2 text-emerald-700 font-mono text-xs font-bold uppercase tracking-widest">
            Refreshing in:<span id="timer" class="text-amber-600">30</span>s
        </div>
    </div>

    <script src="/static/js/display.js"></script>
</body>

</html>
